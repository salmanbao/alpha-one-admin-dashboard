# Working-tree secret scan (docs/secret-scan.md §1). Intentionally does NOT
# scan git history: pre-rewrite history retains flagged values, tracked in
# docs/secret-scan.md §5 pending the rotation/rewrite user decision.
name: secrets

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: raw prefix scan (tracked files)
        run: |
          rc=0
          hits=$(git grep -nE '(sk|pk|rk)[_]live[_]|whsec[_]' -- .) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::secret-like strings found:"
            echo "$hits"
            exit 1
          elif [ "$rc" -gt 1 ]; then
            echo "::error::git grep failed rc=$rc"
            exit 1
          fi
          echo "clean"

      - name: entropy scan (working tree, build dirs excluded)
        run: |
          if grep -rInE '(sk|pk|rk)[_]live[_][A-Za-z0-9_.•*-]*|whsec[_][A-Za-z0-9_.•*-]*' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
              --exclude-dir=dist --exclude-dir=.turbo --exclude-dir=coverage \
              --exclude-dir=.vscode .; then
            echo "::error::secret-like strings found by entropy scan"
            exit 1
          fi
          echo "clean"
